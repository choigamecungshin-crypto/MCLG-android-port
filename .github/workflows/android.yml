name: Android ARM64 APK
on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Restore or create the permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MCLG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > mclg-release.jks
            echo "KEY_WAS_CREATED=false" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore mclg-release.jks -storepass mclg123 -keypass mclg123 -alias mclg -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MCLG, OU=Android, O=MCLG, L=Unknown, ST=Unknown, C=VN"
            echo "KEY_WAS_CREATED=true" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        env:
          MCLG_KEYSTORE_PATH: ${{ github.workspace }}/mclg-release.jks
          MCLG_STORE_PASSWORD: ${{ secrets.MCLG_STORE_PASSWORD || 'mclg123' }}
          MCLG_KEY_ALIAS: mclg
          MCLG_KEY_PASSWORD: ${{ secrets.MCLG_KEY_PASSWORD || 'mclg123' }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MCLG-Android-arm64-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload one-time signing keystore
        if: env.KEY_WAS_CREATED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MCLG-signing-keystore-SETUP-KEEP-SAFE
          path: mclg-release.jks
          retention-days: 30
