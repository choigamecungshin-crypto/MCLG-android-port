name: Android ARM64 APK
on:
  push:
    branches: [android-port]
  pull_request:
    branches: [android-port]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Restore the permanent signing key
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.MCLG_KEYSTORE_BASE64 }}
          MCLG_STORE_PASSWORD: ${{ secrets.MCLG_STORE_PASSWORD || 'mclg123' }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > mclg-release.jks
            echo "Restored signing key from GitHub Actions secret."
          else
            echo "Secret is not configured; restoring the latest saved signing-key artifact."
            artifacts_json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100")"

            artifact_id="$(echo "$artifacts_json" | jq -r '
              [.artifacts[] |
                select(.name == "MCLG-signing-keystore-SETUP-KEEP-SAFE" and .expired == false)
              ] | sort_by(.created_at) | last | .id // empty
            ')"

            if [ -z "$artifact_id" ]; then
              echo "::error::No saved signing key exists. Restore MCLG_KEYSTORE_BASE64 before building."
              exit 1
            fi

            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o signing-key.zip
            unzip -p signing-key.zip mclg-release.jks > mclg-release.jks
          fi

          test -s mclg-release.jks
          keytool -list -keystore mclg-release.jks \
            -storepass "$MCLG_STORE_PASSWORD" -alias mclg >/dev/null
          echo "Permanent signing key verified."

      - name: Build signed release APK
        env:
          MCLG_KEYSTORE_PATH: ${{ github.workspace }}/mclg-release.jks
          MCLG_STORE_PASSWORD: ${{ secrets.MCLG_STORE_PASSWORD || 'mclg123' }}
          MCLG_KEY_ALIAS: mclg
          MCLG_KEY_PASSWORD: ${{ secrets.MCLG_KEY_PASSWORD || 'mclg123' }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MCLG-Android-arm64-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Refresh saved signing-key backup
        uses: actions/upload-artifact@v4
        with:
          name: MCLG-signing-keystore-SETUP-KEEP-SAFE
          path: mclg-release.jks
          retention-days: 90
          if-no-files-found: error

  emulator-smoke-test:
    name: Install and launch ARM64 APK in Android Emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download the APK built by this workflow
        uses: actions/download-artifact@v4
        with:
          name: MCLG-Android-arm64-signed
          path: test-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 15 emulator and smoke-test the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p test-results
            APK="$(find test-apk -type f -name '*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "No APK was downloaded." | tee test-results/test-error.txt
              exit 1
            fi

            echo "Testing APK: $APK" | tee test-results/test-summary.txt
            adb shell getprop ro.build.version.release | tee -a test-results/test-summary.txt
            adb shell getprop ro.build.version.sdk | tee -a test-results/test-summary.txt
            adb shell getprop ro.product.cpu.abilist | tee -a test-results/test-summary.txt

            adb logcat -c
            adb install -r "$APK" 2>&1 | tee test-results/install.txt
            adb shell am force-stop dev.mc.legacy
            adb shell am start -W -n dev.mc.legacy/.MainActivity 2>&1 | tee test-results/activity-start.txt

            # Allow EGL creation, JNI initialization, and several render frames.
            sleep 12

            PID="$(adb shell pidof -s dev.mc.legacy 2>/dev/null | tr -d '\r' || true)"
            adb logcat -d -v threadtime > test-results/logcat.txt
            adb shell dumpsys activity exit-info dev.mc.legacy > test-results/exit-info.txt 2>&1 || true
            adb shell screencap -p /sdcard/mclg-startup.png >/dev/null 2>&1 || true
            adb pull /sdcard/mclg-startup.png test-results/startup.png >/dev/null 2>&1 || true

            if [ -z "$PID" ]; then
              echo "FAIL: app process exited within 12 seconds." | tee -a test-results/test-summary.txt
              grep -Ei 'FATAL EXCEPTION|Fatal signal|am_crash|dev\.mc\.legacy|MCLG-Android|AndroidRuntime' test-results/logcat.txt | tail -n 200 || true
              exit 1
            fi

            if grep -E 'FATAL EXCEPTION|Fatal signal [0-9]+|am_crash|Process: dev\.mc\.legacy' test-results/logcat.txt; then
              echo "FAIL: crash markers found in logcat." | tee -a test-results/test-summary.txt
              exit 1
            fi

            if ! grep -q 'Native GLES3 renderer initialized' test-results/logcat.txt; then
              echo "FAIL: app stayed alive but native GLES3 initialization was not confirmed." | tee -a test-results/test-summary.txt
              grep -Ei 'MCLG-Android|EGL|OpenGL|linker|UnsatisfiedLinkError' test-results/logcat.txt | tail -n 200 || true
              exit 1
            fi

            echo "PASS: Activity stayed alive and native GLES3 initialized. PID=$PID" | tee -a test-results/test-summary.txt

      - name: Upload emulator logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MCLG-emulator-smoke-test
          path: test-results/
          if-no-files-found: warn
